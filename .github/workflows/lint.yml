name: Lint

# ESLint on every PR (5.59.12). eslint.config.js keeps errors to rules that
# catch real bugs (undefined names, hooks called conditionally, a stray
# global `name`/`event`); those fail this check. Warnings (unused
# variables, hook dependencies, Next.js suggestions) are reported but never
# fail it: they are a backlog, not a gate.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps --ignore-scripts

      - run: npm run lint
