[build]
  # Pre-deploy checks run before the Next.js build.
  # If any API health check fails, the build exits non-zero and the deploy is blocked.
  command = "rm -rf .next out && npm run test:pre-deploy && npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # Skip @netlify/plugin-nextjs — this project uses output: 'export' (static)
  # and the plugin's own build cache was preventing our source changes from
  # being compiled into new JavaScript bundles.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Daily anniversary reminder job ("X years ago today you saw...") — runs
# once a day at 13:00 UTC. See netlify/functions/anniversary-notifications.js.
[functions."anniversary-notifications"]
  schedule = "0 13 * * *"

# Daily followed-band job (5.46.0): "a band you follow announced new
# dates" and "a band you follow is playing a venue on your bucket list".
# 13:30 UTC, offset from the anniversary job above. The scheduled function
# only starts followed-band-notifications-background.js, which does the
# work. Replaces venue-bucket-list-notifications. See
# netlify/functions/lib/followedBandAlerts.js.
[functions."followed-band-notifications"]
  schedule = "30 13 * * *"

# Moderation SLA reminder (Guideline 1.2) — re-sends the admin email for
# any report open more than 12 hours, so the 24-hour review commitment in
# the Community Guidelines cannot be missed silently. Every four hours
# rather than daily: a reminder that arrives at the deadline is a
# post-mortem, not a reminder. Offset off the hour so it does not contend
# with the two daily jobs above. See
# netlify/functions/moderation-sla-reminder.js.
[functions."moderation-sla-reminder"]
  schedule = "15 */4 * * *"

# Public band-page snapshot (Netlify Blobs, store "public-artists") — every
# 6 hours. Phish data refreshes on every run, since phish.net allows showing
# it for 24 hours at most; everyone else once a day. The scheduled function
# only starts public-artist-snapshot-background.mjs, which does the fetching
# (scheduled functions get 30 seconds). See netlify/functions/lib/publicArtistSnapshot.js.
[functions."public-artist-snapshot"]
  schedule = "20 */6 * * *"

# The "Songs I've heard" poster and preview images: resvg-js is a native
# module, so it is installed as is rather than bundled, and the poster font
# (Plus Jakarta Sans, SIL OFL) ships alongside. See public-heard-image.js.
[functions."public-heard-image"]
  external_node_modules = ["@resvg/resvg-js"]
  included_files = ["netlify/functions/fonts/*.ttf"]

# Firebase Auth handler, proxied onto our own domain.
#
# Google's sign-in screen shows the app name only for brand-verified OAuth
# clients; unverified ones display the host of the redirect URI instead, which
# is why users saw "show-tracker-d7a4d.firebaseapp.com". Proxying /__/auth/*
# here puts the handler on mysetlists.net, so that is the host Google shows,
# and it makes authDomain same-origin with the app (which is also what Firebase
# recommends for browsers that block third-party storage — Safari's ITP).
#
# status = 200 makes this a transparent proxy, not a redirect; a 301/302 here
# would break the flow. Must stay above the SPA catch-all at the bottom.
#
# NOTE: this proxy approach does not support Sign in with Apple on the WEB.
# Apple is native-only today (components/auth/OAuthButtons.js), so nothing is
# affected — but enabling Apple for web later means revisiting this.
[[redirects]]
  from = "/__/auth/*"
  to = "https://show-tracker-d7a4d.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

