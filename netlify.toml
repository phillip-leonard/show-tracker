[build]
  # Pre-deploy checks run before the Next.js build.
  # If any API health check fails, the build exits non-zero and the deploy is blocked.
  command = "rm -rf .next out && npm run test:pre-deploy && npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # Skip @netlify/plugin-nextjs — this project uses output: 'export' (static)
  # and the plugin's own build cache was preventing our source changes from
  # being compiled into new JavaScript bundles.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Daily anniversary reminder job ("X years ago today you saw...") — runs
# once a day at 13:00 UTC. See netlify/functions/anniversary-notifications.js.
[functions."anniversary-notifications"]
  schedule = "0 13 * * *"

# Daily venue-bucket-list match job ("your favorite artist is playing at a
# venue on your bucket list") — runs once a day at 13:30 UTC, offset from
# the anniversary job above. See
# netlify/functions/venue-bucket-list-notifications.js.
[functions."venue-bucket-list-notifications"]
  schedule = "30 13 * * *"

# Moderation SLA reminder (Guideline 1.2) — re-sends the admin email for
# any report open more than 12 hours, so the 24-hour review commitment in
# the Community Guidelines cannot be missed silently. Every four hours
# rather than daily: a reminder that arrives at the deadline is a
# post-mortem, not a reminder. Offset off the hour so it does not contend
# with the two daily jobs above. See
# netlify/functions/moderation-sla-reminder.js.
[functions."moderation-sla-reminder"]
  schedule = "15 */4 * * *"

# Firebase Auth handler, proxied onto our own domain.
#
# Google's sign-in screen shows the app name only for brand-verified OAuth
# clients; unverified ones display the host of the redirect URI instead, which
# is why users saw "show-tracker-d7a4d.firebaseapp.com". Proxying /__/auth/*
# here puts the handler on mysetlists.net, so that is the host Google shows,
# and it makes authDomain same-origin with the app (which is also what Firebase
# recommends for browsers that block third-party storage — Safari's ITP).
#
# status = 200 makes this a transparent proxy, not a redirect; a 301/302 here
# would break the flow. Must stay above the SPA catch-all at the bottom.
#
# NOTE: this proxy approach does not support Sign in with Apple on the WEB.
# Apple is native-only today (components/auth/OAuthButtons.js), so nothing is
# affected — but enabling Apple for web later means revisiting this.
[[redirects]]
  from = "/__/auth/*"
  to = "https://show-tracker-d7a4d.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# Rewrite /api/* to Netlify functions for static export compatibility
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/send-email/"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/delete-account"
  to = "/.netlify/functions/delete-account"
  status = 200

[[redirects]]
  from = "/api/delete-account/"
  to = "/.netlify/functions/delete-account"
  status = 200

[[redirects]]
  from = "/api/email-preferences"
  to = "/.netlify/functions/update-email-preferences"
  status = 200

[[redirects]]
  from = "/api/email-preferences/"
  to = "/.netlify/functions/update-email-preferences"
  status = 200

[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200

[[redirects]]
  from = "/api/unsubscribe/"
  to = "/.netlify/functions/unsubscribe"
  status = 200

# Moderation (Guideline 1.2). moderate-content is the write path for every
# piece of free text a user can publish — the client no longer writes
# comments, meetup messages or captions to Firestore directly, so the
# content filter cannot be skipped. See netlify/functions/moderate-content.js.
[[redirects]]
  from = "/api/moderate-content"
  to = "/.netlify/functions/moderate-content"
  status = 200

[[redirects]]
  from = "/api/moderate-content/"
  to = "/.netlify/functions/moderate-content"
  status = 200

[[redirects]]
  from = "/api/report-content"
  to = "/.netlify/functions/report-content"
  status = 200

[[redirects]]
  from = "/api/report-content/"
  to = "/.netlify/functions/report-content"
  status = 200

[[redirects]]
  from = "/api/moderate-report"
  to = "/.netlify/functions/moderate-report"
  status = 200

[[redirects]]
  from = "/api/moderate-report/"
  to = "/.netlify/functions/moderate-report"
  status = 200

# Guideline 1.2 requires that blocking notify the developer, not just
# hide content. See netlify/functions/notify-block.js.
[[redirects]]
  from = "/api/notify-block"
  to = "/.netlify/functions/notify-block"
  status = 200

[[redirects]]
  from = "/api/notify-block/"
  to = "/.netlify/functions/notify-block"
  status = 200

# Band-source setlists (El Goose, Phish.net) — see
# netlify/functions/band-setlist.js and lib/setlistSources.js.
#
# Worth knowing while you're here: the "Rewrite /api/* to Netlify functions"
# comment at the top of this section describes an intent, not a wildcard.
# Every /api/… path is spelled out individually and only seven functions
# have one, so a new function does NOT get an /api/ alias for free — it
# needs an entry like this pair or it 404s. (Three of the four callers of
# search-setlists.js sidestep the question entirely by requesting
# /.netlify/functions/search-setlists directly; the fourth, in
# scanForMissingSetlists, asks for /api/search-setlists, which has no
# rewrite here. That one is pre-existing and left alone deliberately — it
# is not this change's to fix, but it is flagged in the PR.)
[[redirects]]
  from = "/api/band-setlist"
  to = "/.netlify/functions/band-setlist"
  status = 200

[[redirects]]
  from = "/api/band-setlist/"
  to = "/.netlify/functions/band-setlist"
  status = 200

# Public, indexable pages — server-rendered HTML from Netlify Functions, not
# the SPA shell, so crawlers see real content without executing JavaScript.
# Order matters: the more specific /u/:handle/shows/:showId rules are listed
# before the plain /u/:handle rules purely for readability — Netlify's
# :param placeholders only match a single path segment, so a request with
# an extra /shows/:showId segment could never match the shorter pattern
# regardless of order. All of these must stay above the final catch-all.
[[redirects]]
  from = "/u/:handle/shows/:showId"
  to = "/.netlify/functions/public-show?handle=:handle&showId=:showId"
  status = 200

[[redirects]]
  from = "/u/:handle/shows/:showId/"
  to = "/.netlify/functions/public-show?handle=:handle&showId=:showId"
  status = 200

[[redirects]]
  from = "/u/:handle"
  to = "/.netlify/functions/public-profile?handle=:handle"
  status = 200

[[redirects]]
  from = "/u/:handle/"
  to = "/.netlify/functions/public-profile?handle=:handle"
  status = 200

[[redirects]]
  from = "/shared/:id"
  to = "/.netlify/functions/public-shared?id=:id"
  status = 200

[[redirects]]
  from = "/shared/:id/"
  to = "/.netlify/functions/public-shared?id=:id"
  status = 200

# Replaces the old static public/sitemap.xml (6 fixed URLs) with a
# generated one that also lists every opted-in public profile.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Show detail URLs — deep links and shared URLs redirect to the query-param form.
# `:showId` only matches a non-empty segment, so /shows/ itself still serves
# the list page.
[[redirects]]
  from = "/shows/:showId"
  to = "/shows/?show=:showId"
  status = 301

[[redirects]]
  from = "/shows/:showId/"
  to = "/shows/?show=:showId"
  status = 301

# Legacy festival detail URLs (the pre-5.29.0 /festivals/<id> dynamic route,
# which static export could never actually serve — see app/festivals/page.jsx)
# now point at the query-param form. `:festivalId` only matches a non-empty
# segment, so /festivals/ itself still serves the list page.
[[redirects]]
  from = "/festivals/:festivalId"
  to = "/festivals/?festival=:festivalId"
  status = 301

[[redirects]]
  from = "/festivals/:festivalId/"
  to = "/festivals/?festival=:festivalId"
  status = 301

# Upcoming Shows was removed in 5.40.0. Old links go to My Shows. force =
# true because app/upcoming/ is still pre-rendered (as a client-side
# redirect, for the native app, which never sees these rules) and Netlify
# would otherwise serve that file instead of applying the redirect.
[[redirects]]
  from = "/upcoming"
  to = "/shows/"
  status = 301
  force = true

[[redirects]]
  from = "/upcoming/"
  to = "/shows/"
  status = 301
  force = true

# Catch-all SPA fallback — lets Next.js handle dynamic routes like /shows/[id]/
# that are not pre-generated at build time (Firebase data is runtime-only).
# Must be last so API rules above take priority.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
