# Moderation (Guideline 1.2). moderate-content is the write path for every
# piece of free text a user can publish — the client no longer writes
# comments, meetup messages or captions to Firestore directly, so the
# content filter cannot be skipped. See netlify/functions/moderate-content.js.
[[redirects]]
  from = "/api/moderate-content"
  to = "/.netlify/functions/moderate-content"
  status = 200

[[redirects]]
  from = "/api/moderate-content/"
  to = "/.netlify/functions/moderate-content"
  status = 200

[[redirects]]
  from = "/api/report-content"
  to = "/.netlify/functions/report-content"
  status = 200

[[redirects]]
  from = "/api/report-content/"
  to = "/.netlify/functions/report-content"
  status = 200

[[redirects]]
  from = "/api/moderate-report"
  to = "/.netlify/functions/moderate-report"
  status = 200

[[redirects]]
  from = "/api/moderate-report/"
  to = "/.netlify/functions/moderate-report"
  status = 200

# Guideline 1.2 requires that blocking notify the developer, not just
# hide content. See netlify/functions/notify-block.js.
[[redirects]]
  from = "/api/notify-block"
  to = "/.netlify/functions/notify-block"
  status = 200

[[redirects]]
  from = "/api/notify-block/"
  to = "/.netlify/functions/notify-block"
  status = 200

# Band-source setlists (El Goose, Phish.net) — see
# netlify/functions/band-setlist.js and lib/setlistSources.js.
#
# Worth knowing while you're here: the "Rewrite /api/* to Netlify functions"
# comment at the top of this section describes an intent, not a wildcard.
# Every /api/… path is spelled out individually and only seven functions
# have one, so a new function does NOT get an /api/ alias for free — it
# needs an entry like this pair or it 404s. (Three of the four callers of
# search-setlists.js sidestep the question entirely by requesting
# /.netlify/functions/search-setlists directly; the fourth, in
# scanForMissingSetlists, asks for /api/search-setlists, which has no
# rewrite here. That one is pre-existing and left alone deliberately — it
# is not this change's to fix, but it is flagged in the PR.)
[[redirects]]
  from = "/api/band-setlist"
  to = "/.netlify/functions/band-setlist"
  status = 200

[[redirects]]
  from = "/api/band-setlist/"
  to = "/.netlify/functions/band-setlist"
  status = 200

# Public, indexable pages — server-rendered HTML from Netlify Functions, not
# the SPA shell, so crawlers see real content without executing JavaScript.
# Order matters: the more specific /u/:handle/shows/:showId rules are listed
# before the plain /u/:handle rules purely for readability — Netlify's
# :param placeholders only match a single path segment, so a request with
# an extra /shows/:showId segment could never match the shorter pattern
# regardless of order. All of these must stay above the final catch-all.
#
# The values travel in the function PATH, not a query string. These rules
# used to rewrite to ...public-profile?handle=:handle, and that placeholder
# never reached the function, so every one of these pages returned 404
# from v5.6.0 until 5.44.4. The functions read the path through
# netlify/functions/lib/publicRouteParams.js, which accepts either the
# public URL or the function URL, whichever Netlify passes as event.path.
[[redirects]]
  from = "/u/:handle/shows/:showId"
  to = "/.netlify/functions/public-show/:handle/:showId"
  status = 200

[[redirects]]
  from = "/u/:handle/shows/:showId/"
  to = "/.netlify/functions/public-show/:handle/:showId"
  status = 200

[[redirects]]
  from = "/u/:handle"
  to = "/.netlify/functions/public-profile/:handle"
  status = 200

[[redirects]]
  from = "/u/:handle/"
  to = "/.netlify/functions/public-profile/:handle"
  status = 200

[[redirects]]
  from = "/shared/:id"
  to = "/.netlify/functions/public-shared/:id"
  status = 200

[[redirects]]
  from = "/shared/:id/"
  to = "/.netlify/functions/public-shared/:id"
  status = 200

# Generated sitemaps (netlify/functions/sitemap.js): /sitemap.xml is an
# index of the two below. robots.txt points at the index.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap-pages.xml"
  to = "/.netlify/functions/sitemap/pages"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap-artists.xml"
  to = "/.netlify/functions/sitemap/artists"
  status = 200
  force = true

# Show detail URLs — deep links and shared URLs redirect to the query-param form.
# `:showId` only matches a non-empty segment, so /shows/ itself still serves
# the list page.
[[redirects]]
  from = "/shows/:showId"
  to = "/shows/?show=:showId"
  status = 301

[[redirects]]
  from = "/shows/:showId/"
  to = "/shows/?show=:showId"
  status = 301

# Venue pages, venue dashboards and Year in Review were dynamic routes
# (/venues/<key>/, /venue-dashboard/<key>/, /year-in-review/<uid>/<year>/)
# with only a `_` placeholder in out/, so a real link fell through to the
# root page. Since 5.46.0 they are query-param routes (lib/showRouting.js);
# old links, bookmarks and already-sent emails land here. Not forced, so the
# real files under /venues/ etc. (index.html, the index.txt RSC payload)
# are still served as they are.
[[redirects]]
  from = "/venues/:venueKey"
  to = "/venues/?venue=:venueKey"
  status = 301

[[redirects]]
  from = "/venues/:venueKey/"
  to = "/venues/?venue=:venueKey"
  status = 301

[[redirects]]
  from = "/venue-dashboard/:venueKey"
  to = "/venue-dashboard/?venue=:venueKey"
  status = 301

[[redirects]]
  from = "/venue-dashboard/:venueKey/"
  to = "/venue-dashboard/?venue=:venueKey"
  status = 301

[[redirects]]
  from = "/year-in-review/:userId/:year"
  to = "/year-in-review/?user=:userId&year=:year"
  status = 301

[[redirects]]
  from = "/year-in-review/:userId/:year/"
  to = "/year-in-review/?user=:userId&year=:year"
  status = 301

# Legacy festival detail URLs (the pre-5.29.0 /festivals/<id> dynamic route,
# which static export could never actually serve — see app/festivals/page.jsx)
# now point at the query-param form. `:festivalId` only matches a non-empty
# segment, so /festivals/ itself still serves the list page.
[[redirects]]
  from = "/festivals/:festivalId"
  to = "/festivals/?festival=:festivalId"
  status = 301

[[redirects]]
  from = "/festivals/:festivalId/"
  to = "/festivals/?festival=:festivalId"
  status = 301

# Upcoming Shows was removed in 5.40.0. Old links go to My Shows. force =
# true because app/upcoming/ is still pre-rendered (as a client-side
# redirect, for the native app, which never sees these rules) and Netlify
# would otherwise serve that file instead of applying the redirect.
[[redirects]]
  from = "/upcoming"
  to = "/shows/"
  status = 301
  force = true

[[redirects]]
  from = "/upcoming/"
  to = "/shows/"
  status = 301
  force = true

# Public band and song pages — HTML rendered by functions from the daily
# snapshot (netlify/functions/lib/publicArtistSnapshot.js). Nothing for
# them is in out/ or the iOS bundle. The slugs travel in the function PATH,
# as with /u/ above (see publicRouteParams.js). force = true so nothing in
# out/ can ever shadow them. All of these must stay above the catch-all.
#
#   /artists/                      every public band
#   /artist/<slug>/                a band page (404 for an unknown slug)
#   /artist/<slug>/song/<song>/    a song page (404 for an unknown song)
#   /artist/<anything else>        a real 404, not the app shell
[[redirects]]
  from = "/artists"
  to = "/.netlify/functions/public-artists-index"
  status = 200
  force = true

[[redirects]]
  from = "/artists/"
  to = "/.netlify/functions/public-artists-index"
  status = 200
  force = true

[[redirects]]
  from = "/artist"
  to = "/artists/"
  status = 301
  force = true

[[redirects]]
  from = "/artist/"
  to = "/artists/"
  status = 301
  force = true

[[redirects]]
  from = "/artist/:slug/song/:song"
  to = "/.netlify/functions/public-artist-song/:slug/:song"
  status = 200
  force = true

[[redirects]]
  from = "/artist/:slug/song/:song/"
  to = "/.netlify/functions/public-artist-song/:slug/:song"
  status = 200
  force = true

[[redirects]]
  from = "/artist/:slug"
  to = "/.netlify/functions/public-artist/:slug"
  status = 200
  force = true

[[redirects]]
  from = "/artist/:slug/"
  to = "/.netlify/functions/public-artist/:slug"
  status = 200
  force = true

# Any other /artist/... path (/artist/goose/foo). Without this the
# catch-all would serve the app shell with a 200: a soft 404.
[[redirects]]
  from = "/artist/*"
  to = "/404.html"
  status = 404
  force = true

# The same snapshot as JSON, for the iOS app: /api/artist?slug=… and
# /api/artist-song?slug=…&song=…, and every show with its setlist for the
# "Songs I've heard" tool: /api/artist-shows?slug=…. The visitor's query
# string passes through.
[[redirects]]
  from = "/api/artist"
  to = "/.netlify/functions/artist-api/band"
  status = 200
  force = true

[[redirects]]
  from = "/api/artist/"
  to = "/.netlify/functions/artist-api/band"
  status = 200
  force = true

[[redirects]]
  from = "/api/artist-song"
  to = "/.netlify/functions/artist-api/song"
  status = 200
  force = true

[[redirects]]
  from = "/api/artist-song/"
  to = "/.netlify/functions/artist-api/song"
  status = 200
  force = true

[[redirects]]
  from = "/api/artist-shows"
  to = "/.netlify/functions/artist-api/shows"
  status = 200
  force = true

[[redirects]]
  from = "/api/artist-shows/"
  to = "/.netlify/functions/artist-api/shows"
  status = 200
  force = true

# "Songs I've heard" (lib/heardPages.js): pick a band, tick your shows,
# get every song you've heard live and a poster. Pages and images rendered
# by functions from the band-page snapshot's show lists; nothing in out/ or
# the iOS bundle. Codes and slugs travel in the function PATH
# (publicRouteParams.js), force = true so nothing in out/ can shadow them,
# and all of it stays above the catch-all.
#
#   /heard/                                pick a band (indexable)
#   /heard/<slug>/                         the tool (indexable)
#   /heard/<slug>/r/<code>/                a shared record (noindex)
#   /heard/<slug>/r/<code>/og.png          its link preview, 1200x630
#   /heard/<slug>/r/<code>/poster-feed.png and poster-story.png
# Both spellings rewrite, as with /artists: Netlify matches a from of
# "/heard" against "/heard/" too, so a 301 to the slash loops.
[[redirects]]
  from = "/heard"
  to = "/.netlify/functions/public-heard"
  status = 200
  force = true

[[redirects]]
  from = "/heard/"
  to = "/.netlify/functions/public-heard"
  status = 200
  force = true

[[redirects]]
  from = "/heard/:slug/r/:code/og.png"
  to = "/.netlify/functions/public-heard-image/:slug/:code/og"
  status = 200
  force = true

[[redirects]]
  from = "/heard/:slug/r/:code/poster-feed.png"
  to = "/.netlify/functions/public-heard-image/:slug/:code/poster-feed"
  status = 200
  force = true

[[redirects]]
  from = "/heard/:slug/r/:code/poster-story.png"
  to = "/.netlify/functions/public-heard-image/:slug/:code/poster-story"
  status = 200
  force = true

[[redirects]]
  from = "/heard/:slug/r/:code"
  to = "/.netlify/functions/public-heard/:slug/r/:code"
  status = 200
  force = true

[[redirects]]
  from = "/heard/:slug/r/:code/"
  to = "/.netlify/functions/public-heard/:slug/r/:code"
  status = 200
  force = true

[[redirects]]
  from = "/heard/:slug"
  to = "/.netlify/functions/public-heard/:slug"
  status = 200
  force = true

[[redirects]]
  from = "/heard/:slug/"
  to = "/.netlify/functions/public-heard/:slug"
  status = 200
  force = true

[[redirects]]
  from = "/heard/*"
  to = "/404.html"
  status = 404
  force = true

# The tool's two JSON helpers: the setlist.fm attendance import and the
# store for selections too long for a link (lib/heardShares.js).
[[redirects]]
  from = "/api/heard-import"
  to = "/.netlify/functions/heard-import"
  status = 200
  force = true

[[redirects]]
  from = "/api/heard-share"
  to = "/.netlify/functions/heard-share"
  status = 200
  force = true

# Catch-all SPA fallback — lets Next.js handle dynamic routes like /shows/[id]/
# that are not pre-generated at build time (Firebase data is runtime-only).
# Must be last so API rules above take priority.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
